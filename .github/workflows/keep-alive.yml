name: Keep Supabase Alive

on:
  schedule:
    # Toutes les 3 jours à 08h00 UTC (évite la mise en pause après 7 jours d'inactivité)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Permet de lancer manuellement si besoin

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Supabase returned status $STATUS"
          else
            echo "Supabase is alive and responding!"
          fi
